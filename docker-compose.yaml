services:
  chat-sql:
    image: mysql:9.6
    env_file:
      - ./envs/.mysql_env
    ports:
      - "127.0.0.1:3333:3306"
    volumes:
      - chat_sql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
  
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./proxy_nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app
    env_file:
      ./envs/.frontend_env
    healthcheck:
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    env_file:
      - ./envs/.backend_env
    ports:
      - 4545:8080
    depends_on:
      chat-sql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthy"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 15s
      

volumes:
  chat_sql_data:
