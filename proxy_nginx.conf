events {}

http {
    include /etc/nginx/mime.types;

    upstream front-upstream {
        server frontend:8000;
    }

    upstream back-upstream {
        server backend:8080;
    }

    server {
        listen 3000;
        server_name chat-server-app;
        
        location ~ ^/_stcore/(stream|host-config|health) {
            proxy_pass http://front-upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
    
            access_log off;
            log_not_found off;
        }

        location /api/v1 {
            proxy_pass http://back-upstream;
        }

        location / {
            proxy_pass http://front-upstream;
        }
    }
}
